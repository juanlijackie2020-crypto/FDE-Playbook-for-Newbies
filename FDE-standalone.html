function scoreQuestion(q, selected = []) {

  return q;
}
function examPool(questions) {
  const ready = questions.filter(q=>q.status==='reviewed' && q.origin!=='demo');
  return {single:ready.filter(q=>q.type==='single'),multiple:ready.filter(q=>q.type==='multiple')};
}
function makeExam(questions, now = Date.now()) {
  const pool=examPool(questions);
  if(pool.single.length<40 || pool.multiple.length<20) throw Error('已审校题库不足：需要 40 道单选和 20 道多选');
  const shuffle = xs => { const a=[...xs]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; };

}
function examResult(exam) {

  return {score,right,unanswered,rows};
}

function questionHTML(q,selected,answered,count,examMode=false){const result=scoreQuestion(q,selected);return `<section class="card question"><div class="section-head"><span class="tag">${q.type==='single'?'单选':'多选'} · ${esc(q.topic)}</span><span class="muted">${count}</span></div><span class="muted">${originName(q.origin)}</span><h2>${esc(q.stem)}</h2><div>${q.options.map((o,i)=>`<label class="option"><input type="${q.type==='single'?'radio':'checkbox'}" name="choice" value="${i}" ${selected.includes(i)?'checked':''} ${answered?'disabled':''}><span>${String.fromCharCode(65+i)}. ${esc(o)}</span></label>`).join('')}</div>${answered?`<div class="result ${result.right?'':'wrong'}"><h3>${result.right?'回答正确':'需要再复习'} · ${result.score} 分</h3><p>正确答案：${q.answer.map(i=>String.fromCharCode(65+i)).join('、')}</p><p>${esc(q.explanation)}</p>${q.optionExplanations.map((t,i)=>`<p>${String.fromCharCode(65+i)} · ${esc(t)}</p>`).join('')}<p class="muted">依据：${esc(sourceName(q))} / ${esc(q.locator)}</p></div><label class="field"><span>复盘笔记：概念、边界、遗漏条件或操作失误</span><textarea id="review-note">${esc(state.notes['q:'+q.id]||'')}</textarea></label><button data-save-review="${q.id}">保存复盘</button>`:examMode?'':`<button class="primary" data-action="submit-answer" ${!selected.length?'disabled':''}>提交答案</button>`}</section>`;}

function settings(){return title('LOCAL & PRIVATE','你的数据，由你保留。','公开应用不包含私有课程文件。个人资料、笔记与作答保存在浏览器。')+`<div class="grid"><div class="card"><h2>完整备份</h2><p class="muted">包含原始资料、题库、笔记、案例、练习与模拟记录。视频较大时备份会占用内存；可先单独保留原视频。</p><div class="actions"><button class="primary" data-action="backup">导出完整备份</button><button data-action="restore">恢复备份</button><input id="restore-input" class="hidden" type="file" accept=".json"></div><p class="muted">恢复会替换当前学习数据，操作前先备份。完整备份是私有文件，请勿提交到公开仓库。</p></div><div class="card"><h2>离线状态</h2><p id="cache-status">检查离线应用缓存…</p><p id="storage-status" class="muted"></p><p class="muted">初次打开需要网络或本地服务器。安装并缓存后可离线重开；导入资料保存在 IndexedDB 中。手机不会自动拥有电脑资料，需导入备份。</p><button data-action="check-offline">检查离线状态</button></div></div><div class="card"><h2>题库导入规范</h2><p class="muted">JSON 文件格式为 {"questions":[…]}。答案为从 0 开始的选项索引；每个选项必须有解析。先导入资料，再在资料信息页复制 sourceId。</p><button data-action="question-template">下载题库模板</button><details><summary>查看字段说明</summary><p class="mono">type: single / multiple\norigin: official / generated / demo\nstatus: draft / reviewed / pending\nsourceId: 已导入资料 ID\nlocator: 页码、章节或时间戳\noptionExplanations: 与选项一一对应的解析数组</p><p>“reviewed”应在人工核对题目与原文后标注；应用不能自动保证内容正确。</p></details></div>`;}
function render(){if(readerURL){URL.revokeObjectURL(readerURL);readerURL=null;}clearInterval(timer);const route=location.hash.slice(1)||'home';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+route));const pages={home,library,course:coursePage,practice:()=>practice(false),mistakes:()=>practice(true),exam,cases,settings};$('#app').innerHTML=(pages[route]||home)();if(storageBroken)$('#app').insertAdjacentHTML('afterbegin','<div class="notice">浏览器数据存储发生错误。请立即备份，避免关闭后丢失。</div>');if(route==='settings')checkOffline();if(route==='exam'&&state.exam&&!state.exam.submittedAt){tick();timer=setInterval(tick,1000);}}
function tick(){const e=state.exam;if(!e||e.submittedAt)return;const remaining=Math.max(0,Math.ceil((e.deadline-Date.now())/1000));const clock=$('#exam-clock');if(clock)clock.textContent=`剩余 ${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`;if(!remaining)finishExam();}

async function checkOffline(){if(location.protocol==='file:'){if($('#cache-status'))$('#cache-status').textContent='单文件版：应用与目录已内嵌，无需服务器。课程正文仍待导入。';if($('#storage-status'))$('#storage-status').textContent='请保持文件路径不变，移动前导出备份。';return;}try{const cache=await caches.open('fde-shell-v2');const found=await Promise.all(['index.html','style.css','app.js','core.js','course.json','manifest.json','icon.svg'].map(p=>cache.match(new URL(p,location.href).href)));const registered=await navigator.serviceWorker.getRegistration();const ok=found.every(Boolean)&&Boolean(registered?.active);if($('#cache-status'))$('#cache-status').textContent=ok?'应用核心文件已缓存，可离线重开。':'缓存未完成，请保持连接并重新打开应用。';const est=await navigator.storage.estimate();if($('#storage-status'))$('#storage-status').textContent=`浏览器已用约 ${((est.usage||0)/1024/1024).toFixed(1)} MB。`;}catch(e){if($('#cache-status'))$('#cache-status').textContent='此浏览器或访问方式不支持离线缓存。请使用 localhost 或 HTTPS。';}}
async function importFiles(list){for(const file of list){const ext=file.name.split('.').pop().toLowerCase();if(!['pdf','txt','md','mp4','webm','ogg'].includes(ext)){toast('跳过不支持的文件：'+file.name);continue;}const bytes=await file.arrayBuffer();const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(b=>b.toString(16).padStart(2,'0')).join('');if(state.sources.some(s=>s.digest===digest)){toast('已存在相同文件：'+file.name);continue;}const id=uid();const type={pdf:'application/pdf',txt:'text/plain',md:'text/plain',mp4:'video/mp4',webm:'video/webm',ogg:'video/ogg'}[ext];await files('put',id,new Blob([bytes],{type}));state.sources.push({id,title:file.name,ext,size:file.size,digest,topic:TOPICS[0],rights:'仅个人学习',importedAt:Date.now(),text:['txt','md'].includes(ext)?await file.text():''});save();}render();toast('资料导入完成');}
async function backup(){toast('正在准备备份，请保持页面打开…');const fileRecords=[];for(const s of state.sources){const blob=await files('get',s.id);if(!blob)throw Error('文件缺失：'+s.title+'，备份未完成');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob);});fileRecords.push({id:s.id,data});}download('fde-private-backup-'+dateKey()+'.json',JSON.stringify({format:'fde-backup',version:1,state,files:fileRecords}));toast('完整备份已导出，请妥善保管');}
function validateBackup(b){if(b?.format!=='fde-backup'||b.version!==1||b.state?.version!==1||!Array.isArray(b.files))throw Error('不是支持的 FDE 备份');const s=b.state;for(const field of ['sources','questions','attempts','cases'])if(!Array.isArray(s[field]))throw Error('备份缺少 '+field);if(!s.notes||typeof s.notes!=='object'||!s.tasks||typeof s.tasks!=='object')throw Error('笔记或学习任务格式无效');const ids=s.sources.map(x=>x.id);if(ids.some(id=>typeof id!=='string')||new Set(ids).size!==ids.length)throw Error('资料 ID 无效或重复');for(const r of s.sources)if(typeof r.title!=='string'||!['pdf','txt','md','mp4','webm','ogg'].includes(r.ext))throw Error('资料格式无效');for(const q of s.questions)validateQuestion(q,ids);if(new Set(s.questions.map(q=>q.id)).size!==s.questions.length)throw Error('题目 ID 重复');for(const c of s.cases)if(typeof c.id!=='string'||typeof c.title!=='string'||typeof c.fields!=='object'||!c.fields)throw Error('案例格式无效');for(const id of ids)if(!b.files.some(f=>f.id===id&&typeof f.data==='string'&&f.data.startsWith('data:')))throw Error('备份缺少资料文件');if(s.exam){if(!Array.isArray(s.exam.questions)||s.exam.questions.length!==60||!s.exam.answers||!Array.isArray(s.exam.flags)||!Number.isFinite(s.exam.deadline)||!Number.isInteger(s.exam.index)||s.exam.index<0||s.exam.index>=60)throw Error('模拟考试状态无效');s.exam.questions.forEach(q=>validateQuestion(q,ids));}return s;}
async function restore(file){const b=JSON.parse(await file.text());const next=validateBackup(b);if(!confirm('恢复将替换当前全部学习数据。你已导出当前备份吗？'))return;const decoded=[];for(const s of next.sources){const f=b.files.find(f=>f.id===s.id);const blob=await (await fetch(f.data)).blob();const bytes=await blob.arrayBuffer();const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(x=>x.toString(16).padStart(2,'0')).join('');if(s.digest!==hash)throw Error('文件完整性校验失败：'+s.title);decoded.push({id:s.id,blob});}const previous=state;for(const f of decoded)await files('put',f.id,f.blob);state=next;try{save();}catch(e){state=previous;throw e;}for(const s of previous.sources)if(!next.sources.some(n=>n.id===s.id))await files('delete',s.id);render();toast('备份恢复完成');}
document.addEventListener('click',async event=>{const el=event.target.closest('button,a');if(!el)return;try{
if(el.dataset.topic){view.topic=el.dataset.topic;view.index=0;}
if(el.dataset.read)await readSource(el.dataset.read);
if(el.dataset.editSource)sourceEditor(el.dataset.editSource);
if(el.dataset.deleteSource){const id=el.dataset.deleteSource;if(state.questions.some(q=>q.sourceId===id)||state.exam?.questions.some(q=>q.sourceId===id))throw Error('该资料有关联题目或模拟记录，需保留来源');if(confirm('删除这份资料和阅读笔记？')){await files('delete',id);state.sources=state.sources.filter(s=>s.id!==id);delete state.notes[id];save();render();}}
if(el.dataset.markRead){const s=state.sources.find(s=>s.id===el.dataset.markRead);s.read=!s.read;save();el.textContent=s.read?'标为未读':'标为已读';}
if(el.dataset.saveNote){state.notes[el.dataset.saveNote]=$('#source-note').value;save();toast('笔记已保存');}
if(el.dataset.saveReview){state.notes['q:'+el.dataset.saveReview]=el.closest('.question').querySelector('textarea').value;save();toast('复盘已保存');}
if(el.dataset.downloadSource){const s=state.sources.find(s=>s.id===el.dataset.downloadSource);const blob=await files('get',s.id);download(s.title,blob,blob.type);}
if(el.dataset.editCase)caseEditor(el.dataset.editCase);
if(el.dataset.exportCase){const c=state.cases.find(c=>c.id===el.dataset.exportCase);download(c.title+'.md',caseMD(c),'text/markdown');}
if(el.dataset.deleteCase&&confirm('删除这个案例？')){state.cases=state.cases.filter(c=>c.id!==el.dataset.deleteCase);save();render();}
if(el.dataset.examIndex!==undefined){state.exam.index=Number(el.dataset.examIndex);save();render();}
switch(el.dataset.action){
case 'import-files':$('#file-input').click();break;
case 'back-library':render();break;
case 'import-questions':$('#question-input').click();break;
case 'demo':for(const q of DEMOS)if(!state.questions.some(x=>x.id===q.id))state.questions.push(structuredClone(q));save();render();break;
case 'submit-answer':{const q=pool()[view.index];if(!view.selected.length)break;const r=scoreQuestion(q,view.selected);state.attempts.push({id:uid(),questionId:q.id,origin:q.origin,selected:[...view.selected],time:Date.now(),...r});save();view.answered=true;render();break;}
case 'prev-question':view.index--;view.answered=false;view.selected=[];render();break;
case 'next-question':view.index++;view.answered=false;view.selected=[];render();break;
case 'start-exam':state.exam=makeExam(state.questions);save();render();break;
case 'finish-exam':if(confirm('确认交卷？提交后不能继续作答。'))finishExam();break;
case 'flag-question':{const e=state.exam,id=e.questions[e.index].id;e.flags=e.flags.includes(id)?e.flags.filter(x=>x!==id):[...e.flags,id];save();render();break;}
case 'reset-exam':if(confirm('开始下一次模拟前，清除本次模拟展示？作答历史仍保留。')){state.exam=null;save();render();}break;
case 'new-case':caseEditor();break;
case 'export-cases':download('FDE-playbook.md',state.cases.map(caseMD).join('\n---\n\n'),'text/markdown');break;
case 'backup':await backup();break;
case 'restore':$('#restore-input').click();break;
case 'check-offline':await checkOffline();break;
case 'question-template':download('questions-template.json',JSON.stringify({questions:[{...DEMOS[0],id:'replace-with-unique-id',origin:'generated',status:'draft',sourceId:'替换为资料 ID',locator:'填写真实页码 / 章节',stem:'替换为资料支持的题干'}]},null,2));break;
}
}catch(e){toast(e.message);}});
document.addEventListener('change',async event=>{const el=event.target;try{
if(el.dataset.task!==undefined){const day=dateKey(),i=Number(el.dataset.task);state.tasks[day]=state.tasks[day]||[];state.tasks[day]=el.checked?[...new Set([...state.tasks[day],i])]:state.tasks[day].filter(x=>x!==i);save();}
if(el.id==='file-input')await importFiles(el.files);
if(el.id==='question-input'&&el.files[0]){const data=JSON.parse(await el.files[0].text());if(!Array.isArray(data.questions))throw Error('JSON 需要 questions 数组');const ids=state.sources.map(s=>s.id),seen=new Set(state.questions.map(q=>q.id));const imported=data.questions.map(q=>{validateQuestion(q,ids);if(typeof q.id!=='string'||!q.id||seen.has(q.id))throw Error('题目 ID 缺失或重复');seen.add(q.id);return q;});state.questions.push(...imported);save();view.index=0;view.selected=[];view.answered=false;render();toast(`导入 ${imported.length} 道题`);}
if(el.id==='restore-input'&&el.files[0])await restore(el.files[0]);
if(el.id==='topic-filter'||el.id==='origin-filter'){view[el.id==='topic-filter'?'topic':'origin']=el.value;view.index=0;view.selected=[];view.answered=false;render();}
if(el.name==='choice'){const selected=[...document.querySelectorAll('input[name=choice]:checked')].map(x=>Number(x.value));if(location.hash==='#exam'&&state.exam&&!state.exam.submittedAt){if(Date.now()>=state.exam.deadline){finishExam();return;}state.exam.answers[state.exam.questions[state.exam.index].id]=selected;save();}else{view.selected=selected;const b=$('[data-action="submit-answer"]');if(b)b.disabled=!selected.length;}}
}catch(e){toast(e.message);}});
document.addEventListener('input',event=>{if(event.target.id==='search'){view.search=event.target.value;const pos=event.target.selectionStart;$('#app').innerHTML=library();$('#search').focus();$('#search').setSelectionRange(pos,pos);}});
document.addEventListener('submit',event=>{event.preventDefault();const form=event.target;try{const data=new FormData(form);if(form.id==='source-form'){const s=state.sources.find(s=>s.id===form.dataset.id);Object.assign(s,{title:data.get('title'),topic:data.get('topic'),locator:data.get('locator'),rights:data.get('rights')});save();render();toast('资料信息已保存');}if(form.id==='case-form'){const c={id:form.dataset.id,title:data.get('title'),kind:data.get('kind'),source:data.get('source'),fields:Object.fromEntries(CASE_FIELDS.map((f,i)=>[f,data.get('f'+i)])),updatedAt:Date.now()};const i=state.cases.findIndex(x=>x.id===c.id);if(i>=0)state.cases[i]=c;else state.cases.push(c);save();render();toast('案例已保存');}}catch(e){toast(e.message);}});
window.addEventListener('hashchange',()=>{view.selected=[];view.answered=false;view.index=0;render();});
function connection(){$('#connection').textContent=navigator.onLine?'在线 · 数据存本机':'离线模式';}window.addEventListener('online',connection);window.addEventListener('offline',connection);connection();
if(location.protocol==='file:'){$('#offline-status').textContent='本地单文件版 · 无需联网';}else if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{$('#offline-status').textContent='离线应用已就绪';}).catch(()=>{$('#offline-status').textContent='离线缓存不可用';});}
render();

</script>
</body></html>
